name: Tests
on:
  push:
    branches: [main]
    paths: ['api/**', 'decode/**', 'embed/**', 'common/**', 'tests/**', 'requirements.txt', '.github/workflows/tests.yml']
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation fonts-freefont-ttf
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q tests
