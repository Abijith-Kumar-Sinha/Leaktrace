<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-4-peacock.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#082a3a}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-brand region text" data-region="brand"><!-- LeakTrace wordmark beside a small peacock-feather monogram icon --><p style="line-height:1.05;margin:0">brand</p></div>
  <div class="r-breadcrumb region text" data-region="breadcrumb"><!-- breadcrumb Investigate / LT-7F3A --><p style="line-height:1.05;margin:0">breadcrumb</p></div>
  <div class="r-search region control" data-region="search"><!-- search field: Search cases, centres: rebuild the control's chrome from the crop (comp-spec.mjs --crop search); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-lang region control" data-region="lang"><!-- EN | hindi language toggle and user avatar icon: rebuild the control's chrome from the crop (comp-spec.mjs --crop lang); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-ops region control" data-region="nav-ops"><!-- Operations label and nav items Prepare paper, Investigate (selected row with saffron bar), Cases: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-ops); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-gov region control" data-region="nav-gov"><!-- Governance label and nav items Key custody, Audit log: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-gov); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-foot region text" data-region="nav-foot"><!-- LeakTrace v1.4.2 and For a fairer tomorrow --><p style="line-height:1.05;margin:0">nav-foot</p></div>
  <div class="r-title region text" data-region="title"><!-- page title Investigation Â· LT-7F3A --><p style="line-height:1.05;margin:0">title</p></div>
  <div class="r-chips region control" data-region="chips"><!-- chips 200 centres and English: rebuild the control's chrome from the crop (comp-spec.mjs --crop chips); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-notice region chrome" data-region="notice"><!-- coral bordered notice: Investigative lead, not proof. Identifies a printed copy, not a person. --></div>
  <div class="r-kpi-verdict region chrome" data-region="kpi-verdict"><!-- saffron to coral gradient verdict tile with dark check icon: Fingerprint found, Statistically significant match --></div>
  <div class="r-kpi-source region text" data-region="kpi-source"><!-- tile Most probable source C0012 --><p style="line-height:1.05;margin:0">kpi-source</p></div>
  <div class="r-kpi-p region text" data-region="kpi-p"><!-- tile p-value 2 x 10^-17 --><p style="line-height:1.05;margin:0">kpi-p</p></div>
  <div class="r-kpi-z region text" data-region="kpi-z"><!-- tile z Â· margin 9.0 Â· 8.6 sigma in lilac --><p style="line-height:1.05;margin:0">kpi-z</p></div>
  <div class="r-evidence-title region text" data-region="evidence-title"><!-- panel heading Evidence --><p style="line-height:1.05;margin:0">evidence-title</p></div>
  <div class="r-evidence-photo region chrome" data-region="evidence-photo"><!-- runtime image slot: the decoder API returns the overlay of the investigator uploaded photo; shown with object-fit cover and rounded corners --></div>
  <div class="r-evidence-caption region text" data-region="evidence-caption"><!-- caption 77/77 shifted words agree Â· 302 gaps Â· 28 lines --><p style="line-height:1.05;margin:0">evidence-caption</p></div>
  <div class="r-dist-title region text" data-region="dist-title"><!-- panel heading Score distribution --><p style="line-height:1.05;margin:0">dist-title</p></div>
  <div class="r-dist-sub region text" data-region="dist-sub"><!-- 4000 wrong keys --><p style="line-height:1.05;margin:0">dist-sub</p></div>
  <div class="r-dist-chart region chrome" data-region="dist-chart"><!-- histogram chart drawn from data at runtime: lilac bins, coral dashed threshold z = 4.4, emerald to saffron bar labelled C0012, axes --></div>
  <div class="r-table-title region text" data-region="table-title"><!-- panel heading Ranked centres --><p style="line-height:1.05;margin:0">table-title</p></div>
  <div class="r-table-sub region text" data-region="table-sub"><!-- Showing top 5 of 200 centres --><p style="line-height:1.05;margin:0">table-sub</p></div>
  <div class="r-table region chrome" data-region="table"><!-- ranked centres table: header row, five rows with teal to emerald score bars, p-values, status pills Significant and Below threshold --></div>
</main>
</body>
</html>
